name: Generate Mintlify artifacts from transcripts

on:
  push:
    paths:
      - "transcripts/*-raw.txt"

  workflow_run:
    workflows: ["Import transcript from sunshinefm-website"]
    types: [completed]

  workflow_dispatch:
    inputs:
      date:
        description: "Transcript date to generate (YYYY-MM-DD). Leave blank to auto-detect."
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # IMPORTANT: don't skip when manually run
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate episode + signals + update Today
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: |
          set -euo pipefail
          python3 scripts/generate_mintlify_artifacts.py

      - name: Commit & push (with rebase + retry)
        run: |
          set -euo pipefail
          git config user.name "SunshineFM Bot"
          git config user.email "bot@sunshine.fm"

          git add intelligence/episodes intelligence/signals transcripts || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "feat: generate Mintlify artifacts from transcript"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push failed (attempt $i). Retrying in 3s..."
            sleep 3
          done

          echo "Push failed after retries."
          exit 1
