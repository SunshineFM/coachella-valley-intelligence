name: Generate Mintlify artifacts from transcripts

on:
  push:
    paths:
      - "transcripts/source/*.txt"
      - "transcripts/source/*.md"

  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD-HHMM format)'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Step 1: Resolve the transcript date ──────────────────────────────
      # Priority: explicit workflow_dispatch input > latest changed .txt/.md in push
      - name: Resolve transcript date
        id: resolve_date
        run: |
          set -euo pipefail

          DATE="${{ github.event.inputs.date }}"

          if [ -z "$DATE" ]; then
            # Auto-detect: find the raw transcript (.txt or .md) changed in this push
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'transcripts/source/*.txt' 'transcripts/source/*.md' \
              | head -1)

            if [ -z "$CHANGED" ]; then
              echo "No new raw transcript found in this commit. Nothing to do."
              echo "date=" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Strip extension (.txt or .md) to get the date slug
            DATE=$(basename "$CHANGED" | sed 's/\.[^.]*$//')
          fi

          echo "Resolved date: $DATE"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      # ── Step 2: Run Mintlify artifact generator ───────────────────────────
      - name: Generate Intelligence Brief
        if: steps.resolve_date.outputs.date != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          DATE="${{ steps.resolve_date.outputs.date }}"
          echo "Running generate_mintlify_artifacts.py for $DATE ..."
          python3 scripts/generate_mintlify_artifacts.py --date "$DATE"
          echo "Artifact generation complete."

      # ── Step 4: Commit everything (with rebase + retry) ──────────────────
      - name: Commit & push
        if: steps.resolve_date.outputs.date != ''
        run: |
          set -euo pipefail
          git config user.name "SunshineFM Bot"
          git config user.email "bot@sunshine.fm"

          # Stage: intelligence brief, transcript page, nav, home page
          git add intelligence transcripts/pages docs.json index.mdx || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          DATE="${{ steps.resolve_date.outputs.date }}"
          git commit -m "feat: intelligence brief for $DATE"

          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && {
              echo "Push succeeded on attempt $i."
              exit 0
            } || {
              echo "Push failed (attempt $i). Aborting rebase and retrying in 5s..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            }
          done

          echo "ERROR: Push failed after 3 attempts."
          exit 1
